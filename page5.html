<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalyan Matka - Satta Sadhu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 800;
    }

    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #0b1322;
      border: 3px solid #facc15;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    /* Header Styling */
    .header-title {
      color: #f97316;
      font-size: 26px;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .header-subtitle {
      color: #38bdf8;
      font-size: 11px;
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-weight: 800;
    }

    /* Profile Section */
    .profile-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid #facc15; /* Peele colour ka border */
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    /* Top Buttons */
    .btn-blue {
      background-color: #0066ff;
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-yellow {
      background-color: #f59e0b;
      color: #000000;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 13px;
      text-decoration: none;
    }

    /* Telegram Main Buttons */
    .btn-telegram {
      background-color: #0066ff;
      color: #ffffff;
      border: 2px solid #60a5fa;
      border-radius: 14px;
      padding: 18px 14px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      letter-spacing: 0.5px;
      animation: borderBubble 2s infinite ease-in-out;
      transition: transform 0.2s;
    }

    .telegram-icon {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    /* Border Bubbling Animation */
    @keyframes borderBubble {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 102, 255, 0.8), 0 0 8px rgba(0, 102, 255, 0.6);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(0, 102, 255, 0), 0 0 18px rgba(56, 189, 248, 0.9);
        transform: scale(1.02);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 102, 255, 0.8), 0 0 8px rgba(0, 102, 255, 0.6);
        transform: scale(1);
      }
    }

    /* Info Boxes */
    .info-box {
      background-color: #111a2e;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 12px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .icon-blue { color: #38bdf8; font-size: 14px; }
    .icon-yellow { color: #eab308; font-size: 14px; }

    /* Footer */
    .footer-text {
      color: #f59e0b;
      font-size: 12px;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

</body>
</html>
