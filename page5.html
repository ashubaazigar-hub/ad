  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    body {
      background-color: #0b141d;
      color: #ffffff;
      display: flex;

      min-height: 100vh;
      padding: 40px 15px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    /* DP Without Bubbling Animation */
    .avatar-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #ffcc00; /* Normal Yellow Border */

    .avatar-wrapper img {

    /* Title */
    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Online Subscribers Styling */
    .subscribers {
      color: #22c55e;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .green-dot {
      font-size: 24px;
      line-height: 0;
      color: #22c55e;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Button Border Bubbling Animation */
    @keyframes buttonBubbling {
      0% {
        box-shadow: 0 0 0 0px rgba(255, 204, 0, 0.8);
      }
      50% {
        box-shadow: 0 0 0 16px rgba(255, 204, 0, 0);
      }
      100% {
        box-shadow: 0 0 0 0px rgba(255, 204, 0, 0);
      }
    }

    /* Peele Colour Ka Button + Extra Bold Text + Bubbling Border */
    .btn-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background-color: #ffcc00;
      color: #000000;
      text-decoration: none;
      font-size: 21px;
      font-weight: 900; /* Extra Bold Text */
      padding: 18px 24px;
      border-radius: 16px;
      border: 2px solid #ffcc00;
      animation: buttonBubbling 1.8s infinite ease-in-out; /* Button Bubbling Effect */
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-telegram:hover {
      background-color: #e6b800;
      transform: translateY(-2px);
    }

    /* 3 Minutes Redirecting Text */
    .redirect-text {
      color: #64748b;
      font-size: 15px;
      margin-top: 22px;
      margin-bottom: 40px;

    /* Description Section */

      margin-bottom: 16px;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .check-icon {
      font-size: 18px;
    }

<body>

  <div class="container">
    <!-- DP (Static Yellow Border) -->
    <div class="avatar-wrapper">
      <img src="IMG_20260715_205338_752.jpg" alt="Baazigar Vip Matka">
    </div>

    <!-- Title -->
    <h1 class="title">Baazigar Vip Matka</h1>

    <!-- Online Subscribers -->
    <div class="subscribers">
      <span class="green-dot">•</span> 5.789 Subscribers Online Now
    </div>

    <!-- Tagline Text -->
    <div class="subtitle">
      <p>No. 1 Matta King</p>
      <p>Trusted By 32.067+ Members</p>
    </div>

    <!-- Yellow Button (Bold Text + Bubbling Border) -->
    <a href="https://t.me/+JlCKEm_37atmZDVl" class="btn-telegram" id="telegramBtn">
      🚀 Free Telegram Channel
    </a>

    <!-- 3 Minutes Countdown Text -->
    <p class="redirect-text">
      Redirecting in <span id="countdown">15</span> second...
    </p>

    <!-- Description List -->
    <div class="description-section">
      <h2 class="description-title">Description</h2>
      <ul class="feature-list">
        <li class="feature-item"><span class="check-icon">✅</span> Giving Results For Last 6 Years</li>
        <li class="feature-item"><span class="check-icon">✅</span> Community of 50,000+ Members</li>
        <li class="feature-item"><span class="check-icon">✅</span> Ek Baar Results Jaroor Dekhe</li>
        <li class="feature-item"><span class="check-icon">✅</span> Free Joining</li>
      </ul>
    </div>
  </div>

  <script>
    // 3 Minutes Timer (180 Seconds)
    let totalSeconds = 180;
    const countdownElement = document.getElementById('countdown');
    const telegramLink = "https://t.me/+JlCKEm_37atmZDVl";

    function updateCountdownDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      const formattedMinutes = String(minutes).padStart(2, '0');
      const formattedSeconds = String(seconds).padStart(2, '0');
      
      if (countdownElement) {
        countdownElement.textContent = `${formattedMinutes}:${formattedSeconds}`;
      }
    }

    const timer = setInterval(() => {
      totalSeconds--;
      updateCountdownDisplay();
      
      if (totalSeconds <= 0) {
        clearInterval(timer);
        window.location.href = telegramLink; // 3 minut baad auto redirect
      }
    }, 1000);
  </script>

</body>
