<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalyan Matka UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #0b1322;
      border: 3px solid #facc15;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    /* Header Styling */
    .header-title {
      color: #f97316;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-subtitle {
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* Profile Section */
    .profile-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    /* Buttons */
    .btn-blue {
      background-color: #0066ff;
      color: #ffffff;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-yellow {
      background-color: #f59e0b;
      color: #000000;
      font-weight: 800;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 12px;
      text-decoration: none;
    }

    .btn-telegram {
      background-color: #0066ff;
      color: #ffffff;
      font-weight: 700;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    /* Info Items */
    .info-box {
      background-color: #111a2e;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .icon-blue { color: #38bdf8; font-weight: bold; }
    .icon-yellow { color: #eab308; }

    /* Footer */
    .footer-text {
      color: #f59e0b;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div>
      <h1 class="header-title">KALYAN MATKA</h1>
      <p class="header-subtitle">SRIDEVI • TIME BAZAAR • KALYAN DAY</p>
    </div>

    <!-- Profile + Top Buttons -->
    <div class="profile-row">
      <img src="https://via.placeholder.com/110" alt="Profile" class="profile-img">
      <div class="profile-actions">
        <a href="#" class="btn-blue">
          <span>🏆</span> OPEN • JODI • PANEL
        </a>
        <a href="#" class="btn-yellow">
          BAAZIGAR MATKA
        </a>
      </div>
    </div>

    <!-- Telegram Channel Button 1 -->
    <a href="#" class="btn-telegram">
      <span>✈</span>
      <span>JOIN TELEGRAM CHANNEL</span>
      <span>✈</span>
    </a>

    <!-- Market Analysis -->
    <div class="info-box">
      <span class="icon-blue">✓</span>
      <span>MARKET ANALYSIS AND FREE TIPS</span>
    </div>

    <!-- Game Available -->
    <div class="info-box">
      <span class="icon-yellow">⚡</span>
      <span>SATKA MATKA ALL GAME AVAILABLE</span>
    </div>

    <!-- Telegram Channel Button 2 -->
    <a href="#" class="btn-telegram">
      <span>✈</span>
      <span>JOIN TELEGRAM CHANNEL</span>
      <span>✈</span>
    </a>

    <!-- Footer Message -->
    <p class="footer-text">SABHI GARIB BHAI TELEGRAM CHANNEL JOIN KARE</p>
  </div>

</body>
</html>
